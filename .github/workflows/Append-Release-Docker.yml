name: Build via Append and Release to GH & Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build:
    name: Build-Append and Release (Docker Hub)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Restore Cache Docker
        uses: actions/cache/restore@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Restore Cache GoLang
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-golang-
      - name: Get version
        id: version
        uses: michmich112/extract-version@main
        with:
          # specify here the path to your version file (e.g. package.json, pom.xml...)
          version-file: VERSION
          schema: major.minor.build
      - name: Version Debug
        run: |
          echo "Version to Release -> $VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build CoreDNS
        run: make build-append
    
      - name: Tarball
        run: make tar CUSTOMIZED_VERSION=${{ steps.version.outputs.version }}
      
      - name: Github Release
        run: make github-create-release github-upload github-publish-release CUSTOMIZED_VERSION=${{ steps.version.outputs.version }} GITHUB_REPO=${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # While this say password, it is recommended to use PATs. See: https://docs.docker.com/security/access-tokens/
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Build and Push
        run: make docker-build docker-push 
        env:
          DOCKER_REPO: ${{ vars.DOCKERHUB_REPO }} 
          DOCKER_NAME: ${{ vars.DOCKERHUB_NAME }}
          DOCKER_LOGIN: ${{ secrets.DOCKERHUB_USERNAME }}
          # While this say password, it is recommended to use PATs. See: https://docs.docker.com/security/access-tokens/
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Save Cache Docker
        uses: actions/cache/save@v5
        if: always()
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
      - name: Save Cache GoLang
        uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-${{ github.sha }}